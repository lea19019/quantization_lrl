[project]
name = "qlrl"
version = "0.0.1"
description = "Quantization damage on low-resource languages (master's project)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "numpy",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# Local machine has no NVIDIA GPU: take torch from the CPU-only wheel index.
# On the cluster, replace this index with the CUDA one matching `module spider cuda`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]
