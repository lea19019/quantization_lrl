# Qwen 2.5 7B on the church test split, full precision, then 4 and 3 bits, one Slurm
# array task per model (23):
#   sbatch --array=0-22 slurm/run.sh qlrl.evaluation configs/eval/church/qwen.yaml
# Writes results/eval_church/<model folder name>/{scores,manifest}.json, translation/, perplexity/.
model:                     # the array index picks one
  - Qwen/Qwen2.5-7B
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-rtn-4bit
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-4bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-4bit-seed1
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-4bit-seed2
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-4bit-seed3
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-4bit-seed4
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-4bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-4bit-seed1
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-4bit-seed2
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-4bit-seed3
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-4bit-seed4
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-rtn-3bit
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-3bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-3bit-seed1
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-3bit-seed2
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-3bit-seed3
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-gptq-3bit-seed4
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-3bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-3bit-seed1
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-3bit-seed2
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-3bit-seed3
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Qwen2.5-7B-awq-3bit-seed4
dtype: bfloat16
data: data/processed
output: results/test/eval_church

# The church test split (1,000 held-out pairs per language). Nahuatl and Bribri have no
# church data; Kichwa is already evaluated on church in results/eval_v2.
languages: [fra, spa, por, yor, zul, swh, amh, kek, grn]
test_sets:                 # the one test set of each language
  fra: church
  spa: church
  por: church
  yor: church
  zul: church
  swh: church
  amh: church
  kek: church
  grn: church
max_sentences: 20
examples: 3                # dev pairs in each prompt
batch_size: 32             # sentences generated at once

metrics: [chrf, bleu, africomet, off_target, reference_logprob, perplexity]

africomet:
  repo: masakhane/africomet-stl-1.1
  revision: b4065f4424a962cf6e52373a9ec8a22a624fb278
  comet_score: .venv-comet/bin/comet-score
  batch_size: 16
  languages: [fra, yor, zul, swh, amh]   # paired with English, both directions

glotlid:                   # off-target rate: English or not (see offTargert_eval)
  repo: cis-lmu/glotlid
  revision: 85cd6716494360367b75f642b5bc78667605d0b4
