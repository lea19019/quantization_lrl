# Mixed-precision swap on Llama-3.1-8B-lora, all languages. One Slurm array task per quantized
# model; both models sit on one GPU (about 30 GB):
#   sbatch --array=0-1 --gpus=a100:1 --time=03:00:00 slurm/run.sh qlrl.experiments.swap configs/experiments/swap.yaml
# (It was run in two parts of languages, in parallel; the results are merged.)
model: models/Llama-3.1-8B-lora
quantized:                 # the array index picks one
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-4bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-3bit-seed0
dtype: bfloat16
data: data/processed
output: results/experiments/swap

languages: [spa, fra, por, amh, swh, yor, zul, kek, grn, qug, nah, bzd]
test_sets:                 # the one test set of each language
  spa: church
  fra: church
  por: church
  amh: church
  swh: church
  yor: church
  zul: church
  kek: church
  grn: church
  qug: church
  nah: americasnlp
  bzd: americasnlp
max_sentences: null        # null = the whole test set
examples: 3                # dev pairs in each prompt
hybrids:                   # name: [first, last] layer using quantized weights, both included
  early: [0, 5]
  middle: [6, 19]
  late: [20, 31]
