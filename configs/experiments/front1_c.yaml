# Front 1 on the remaining languages, part of the same map as configs/experiments/front1.yaml. Own
# output folder, because recovered.json, head_change.json and manifest.json are written per run.
#   sbatch --array=0-1 --gpus=a100:1 slurm/run.sh qlrl.experiments.run configs/experiments/front1_c.yaml
model: models/Llama-3.1-8B-lora
quantized:                 # the array index picks one
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-4bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-3bit-seed0
dtype: bfloat16
data: data/processed
output: results/front1_c

languages: [grn, qug, nah, bzd]
test_sets:                 # the one test set of each language
  grn: church
  qug: church
  nah: americasnlp
  bzd: americasnlp
max_sentences: null        # null = the whole test set
examples: 3                # dev pairs in each prompt
