# Steps 1 and 2 of the weight reading: structure of the rounding error in the late down_proj
# weights and the tokens it favors. No GPU. One Slurm array task per quantized model.
model: models/Llama-3.1-8B-lora
quantized:                 # the array index picks one
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-3bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-4bit-seed0
output: results/weights
layers: [20, 31]           # first, last, both included
group_size: 128            # as in configs/quantize/llama_3bit.yaml
directions: 5              # top singular directions read through the head
tokens: 20                 # tokens kept at each end of a direction
seed: 0                    # of the shuffles and the random direction
