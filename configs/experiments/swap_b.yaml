# Mixed-precision swap on the remaining languages, part of the same map as
# configs/experiments/swap.yaml. Own output folder, because manifest.json is written per run.
#   sbatch --array=0-1 --gpus=a100:1 --time=02:00:00 slurm/run.sh qlrl.experiments.swap configs/experiments/swap_b.yaml
model: models/Llama-3.1-8B-lora
quantized:                 # the array index picks one
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-4bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-3bit-seed0
dtype: bfloat16
data: data/processed
output: results/swap_b

languages: [por, yor, zul, kek, grn, qug, nah, bzd]
test_sets:                 # the one test set of each language
  por: church
  yor: church
  zul: church
  kek: church
  grn: church
  qug: church
  nah: americasnlp
  bzd: americasnlp
max_sentences: null        # null = the whole test set
examples: 3                # dev pairs in each prompt
hybrids:                   # name: [first, last] layer using quantized weights, both included
  early: [0, 5]
  middle: [6, 19]
  late: [20, 31]
