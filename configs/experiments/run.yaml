# Front 1 on Llama-3.1-8B-lora, all languages: patching, logit lens, noise vs flatness and
# activation change. One Slurm array task per quantized model. Both models sit on one GPU
# (about 30 GB), so it needs more than a P100:
#   sbatch --array=0-1 --gpus=a100:1 slurm/run.sh qlrl.experiments.run configs/experiments/run.yaml
# (It was run in four parts of languages, in parallel; the results are merged.)
model: models/Llama-3.1-8B-lora
quantized:                 # the array index picks one
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-4bit-seed0
  - /nobackup/autodelete/usr/vacl2/quantization_lrl/models/Llama-3.1-8B-lora-gptq-3bit-seed0
dtype: bfloat16
data: data/processed
output: results/experiments

languages: [spa, fra, por, amh, swh, yor, zul, kek, grn, qug, nah, bzd]
test_sets:                 # the one test set of each language
  spa: church
  fra: church
  por: church
  amh: church
  swh: church
  yor: church
  zul: church
  kek: church
  grn: church
  qug: church
  nah: americasnlp
  bzd: americasnlp
max_sentences: null        # null = the whole test set
examples: 3                # dev pairs in each prompt
