# CPU test of the fine-tune: python -m qlrl.finetune configs/finetune/test.yaml
# A tiny random Llama (2 layers) with the real Llama 3.1 tokenizer and layer names, and a few
# hundred pairs: checks that every piece runs, not that it learns. Writes models/test/<name>/.
model: meta-llama/Llama-3.1-8B
tiny: {hidden_size: 64, intermediate_size: 128, num_hidden_layers: 2,
       num_attention_heads: 4, num_key_value_heads: 2}
dtype: float32
data: data/processed
output: models/test
results: results/test/finetune
name: finetune-test
seed: 0

languages: [yor, nah, bzd]
caps: {yor: 200, nah: 200, bzd: 100}   # pairs per language; a language not listed keeps all
pairs_per_sequence: 4      # 3 examples + the graded pair, as in the evaluation prompt
max_length: 512            # tokens; longer rows are dropped

# Dev loss: church dev, and AmericasNLP where there is no church (nah, bzd).
dev:
  sources: [church, americasnlp]
  pairs: 40                # per language, a seeded random subset: 10 sequences

mode: lora                 # full | lora
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  optimizer: adamw         # adamw | adamw8bit (bitsandbytes, GPU only)
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_ratio: 0.1
  batch_size: 4
  accumulation: 2
  clip: 1.0
  gradient_checkpointing: false
  log_every: 5
  eval_every: 5            # steps between dev losses (and at step 0 and the end)
  checkpoint_every: 5      # steps between checkpoints; a rerun resumes from the last
