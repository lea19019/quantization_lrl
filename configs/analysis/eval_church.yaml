# Analysis of the finished runs in results/eval_church (the church test split):
#   python -m qlrl.analysis configs/analysis/eval_church.yaml
# Writes <output>/summary.md, damage.csv, translation.csv. Unfinished runs are skipped.
results: results/eval_church
output: results/analysis/eval_church
africomet_floor: results/analysis/africomet_floor_church.json   # church references; computed once if missing (GPU)

bootstrap:
  samples: 1000             # resamples of sentences
  seed: 0                   # also the seed of the shuffled references (the floor)
  level: 0.95
  floor_standard_errors: 3  # above floor: full - floor > 3 bootstrap standard errors

models:                     # run folder: <full>-<method>-<bits>bit[-seed<seed>]
  Llama-3.1-8B:
    full: Llama-3.1-8B
    bits: [4, 3]
    methods: {rtn: [null], gptq: [0, 1, 2, 3, 4], awq: [0, 1, 2, 3, 4]}  # null: no seed
  Qwen2.5-7B:
    full: Qwen2.5-7B
    bits: [4, 3]
    methods: {rtn: [null], gptq: [0, 1, 2, 3, 4], awq: [0, 1, 2, 3, 4]}
  Llama-3.1-8B-lora:        # fine-tuned (configs/finetune/lora.yaml), quantized the same way
    full: Llama-3.1-8B-lora
    bits: [4, 3]
    methods: {rtn: [null], gptq: [0, 1, 2, 3, 4], awq: [0, 1, 2, 3, 4]}
