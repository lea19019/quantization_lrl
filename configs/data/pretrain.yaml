# Splits for the from-scratch model: python -m qlrl.data.prepare configs/data/pretrain.yaml [--test]
# Same rules as data.yaml (docs/project/pretraining_data.md section 3), for every church language
# kept (123: 141 folders minus the 17 near-empty and ASL) plus Nahuatl, Bribri and Ayacucho
# Quechua. Writes to its own folders so phase 1's data/processed is untouched.
church: /home/vacl2/groups/grp_mtlab/nobackup/archive/all-data/church-data-2026
external: data/external
translated: data/translated_pretrain   # links to data/translated and data/translated_quechua
cleaning: data/cleaning_pretrain
output: data/processed_pretrain
seed: 0
split: shared                  # same held-out verses in every language (split.hold_out_shared)
held_out: 1000                 # church dev and test pairs per language, at most
held_out_fraction: 0.1         # ... and at most this fraction of the language's pairs, each
held_out_core: 250             # of which this many are the same verses in every language
protect_below: 5000            # languages with fewer pairs hold out core lines only, and others
                               # never hold out their lines (split.hold_out_shared)
decontaminate_sentences: true  # also drop train pairs with a held-out sentence inside a side
cleaner: /home/vacl2/data-cleaning-pipeline

