# Free-text cleaning for pretraining (qlrl/data/freetext.py), one corpus per Slurm array task:
#   mkdir -p slurm/output
#   sbatch --array=0-118 --gpus=0 slurm/run.sh qlrl.data.freetext configs/data/freetext.yaml
# Writes <output>/<source>/<code>/{train,valid}.parquet and manifest.json. Run from the repo root.
wikipedia: /home/vacl2/nobackup/archive/wikipedia       # wikimedia/wikipedia 20231101.<code>
fineweb: /home/vacl2/nobackup/archive/fineweb2/data     # HuggingFaceFW/fineweb-2 <code>_Latn
output: /home/vacl2/nobackup/archive/freetext
seed: 0
parallel_splits: data/processed_pretrain   # qlrl/data/monolingual.py: target sides of the train splits
max_docs: 1000000          # per corpus, a seeded sample; only the largest Wikipedias exceed it

# Every dev and test sentence that must not appear in pretraining text (both sides, all languages).
held_out:
  - data/processed_pretrain/*/dev.jsonl
  - data/processed_pretrain/*/test.jsonl
  - data/external/flores_plus/*/*.jsonl

glotlid: {repo: cis-lmu/glotlid, revision: 85cd6716494360367b75f642b5bc78667605d0b4,
          threshold: 0.9, min_chars: 30, max_chars: 200}   # shorter lines not judged; first 200 read
min_line_chars: 80          # Wikipedia: shorter lines without sentence punctuation are dropped
templates: {vocabulary_docs: 100000, frequent_words: 100, min_count: 100, keep: 10}  # words in most docs
validation: {fraction: 0.01, max_docs: 500}

# FineWeb-2: religious sites (their verses could be church test sentences), machine-translated sites,
# and Wikipedia pages (already in the Wikipedia corpora; counting them twice would inflate the share).
blocked_sites: [bible.is, jw.org, ebible.org, bibles.org, biblegateway.com, biblica.com, bible.com,
                stepbible.org, breakeveryyoke.com, gospelgo.com, beblia.com, wordproject.org,
                divinerevelations.info, biblerevelation.org, americanbible.org, churchofjesuschrist.org,
                femissionaria.blogspot.com, scriptureearth.org,
                hielscher.com, mokosmart.com, mokotechnology.com, asuwantpackaging.com,
                wikipedia.org, wikimedia.org]
blocked_url_words: [bible, biblia, scripture, gospel, evangel, iglesia]

# The zh wiki mixes Simplified and Traditional articles (separate languages here). Each article
# goes to the script whose characters it uses (text_filters.script_of): characters seen only in the
# church Chinese S or only in Chinese T, outnumbering the other script's `ratio` to 1; else dropped.
scripts: {church: /home/vacl2/groups/grp_mtlab/nobackup/archive/all-data/church-data-2026,
          folders: {hans: "Chinese S", hant: "Chinese T"}, min_count: 20, ratio: 3}

# [source, code, GlotLID labels that count as the corpus's own language]. The labels are GlotLID's
# top label on a sample of the corpus, plus dialects, macro-language members and GlotLID confusions
# seen on that sample (e.g. Russian lines labelled Ingush). Spanish and English are never added, nor
# other varieties that are separate languages here (Quechua varieties, Kaqchikel, Nynorsk, Mandarin
# in the Cantonese wiki): a line GlotLID is sure belongs to one of those is dropped. The qu wiki
# (mixed Southern Quechua varieties) is not used.
